# Mount this file at /etc/mediamoth/postgres.yaml.
# Override credentials using POSTGRESUSERS__0__PASSWORD, etc.
PostgresUsers:
  - Username: media_app
    Password: replace-this-password
PostgresDatabases:
  - Name: media
    Grant:
      - Username: media_app
        Perms: [CREATE]
    PostgresSchemas:
      - Name: application
        Grant:
          - Username: media_app
            Perms: [USAGE, CREATE]
