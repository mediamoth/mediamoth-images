name: Verify Images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    # chapter-ml includes a multi-gigabyte CUDA layer. The self-hosted runner
    # has the capacity and retains BuildKit cache between image builds.
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: [media-runtime, chapter-ml, video-runtime, postgres-runtime]
    steps:
      - uses: actions/checkout@v4

      - name: Check runner disk capacity
        if: matrix.image == 'chapter-ml'
        run: scripts/check-disk.sh

      - name: Load pinned image inputs
        run: |
          while IFS= read -r assignment; do
            case "$assignment" in
              \#*|'') ;;
              *) echo "$assignment" ;;
            esac
          done < versions.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.image }}
          load: ${{ matrix.image == 'postgres-runtime' }}
          tags: mediamoth-images/${{ matrix.image }}:ci
          build-args: |
            DEBIAN_IMAGE=${{ env.DEBIAN_IMAGE }}
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            GO_IMAGE=${{ env.GO_IMAGE }}
            POSTGRES_IMAGE=${{ env.POSTGRES_IMAGE }}
            CDML_REPOSITORY=${{ env.CDML_REPOSITORY }}
            CDML_REVISION=${{ env.CDML_REVISION }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}
            GRPC_HEALTH_PROBE_VERSION=${{ env.GRPC_HEALTH_PROBE_VERSION }}
            GRPC_HEALTH_PROBE_SHA256=${{ env.GRPC_HEALTH_PROBE_SHA256 }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Test PostgreSQL image lifecycle
        if: matrix.image == 'postgres-runtime'
        run: scripts/test-postgres-image.sh mediamoth-images/postgres-runtime:ci

  postgres-go:
    defaults:
      run:
        working-directory: postgres-init
    runs-on: self-hosted
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-admin
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test and vet PostgreSQL initializer
        env:
          TEST_POSTGRES_DSN: postgres://postgres:test-admin@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          docker run --rm \
            --network host \
            --mount "type=bind,src=$GITHUB_WORKSPACE/postgres-init,dst=/src,readonly" \
            --workdir /src \
            --env CGO_ENABLED=1 \
            --env TEST_POSTGRES_DSN \
            golang:1.27 \
            sh -ec 'go test -race ./...; go vet ./...'
